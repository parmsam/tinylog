<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="One-tap baby tracker: feeds, diapers, sleep, tummy time. All data stays on your phone." />
    <meta name="theme-color" content="#1b1726" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>tinylog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="glow g3"></div>
    </div>

    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-dot" aria-hidden="true"></span><span id="brand-name">tinylog</span></div>
        <div class="topbar-actions">
        <button id="shortcuts-open" class="icon-btn kbd-only" type="button" aria-label="Keyboard shortcuts (?)" title="Keyboard shortcuts (?)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg>
        </button>
        <button id="ambient-open" class="icon-btn" type="button" aria-label="Bedside display (A)" title="Bedside display (A)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button id="trends-open" class="icon-btn" type="button" aria-label="Trends (G)" title="Trends (G)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
        </button>
        <button id="settings-open" class="icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
        </div>
      </header>

      <nav class="daynav" aria-label="Day">
        <button id="day-prev" class="icon-btn" type="button" aria-label="Previous day" title="Previous day (←)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="daynav-title">
          <h1 id="day-title">Today</h1>
          <button id="day-today" class="link-btn" type="button" hidden>Back to today</button>
        </div>
        <button id="day-next" class="icon-btn" type="button" aria-label="Next day" title="Next day (→)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </nav>

      <div id="companion" class="companion" hidden>
        <div class="puff-host"></div>
        <p class="companion-line"></p>
      </div>

      <div id="banner" class="banner" hidden></div>

      <main>
        <section id="cards" class="cards" aria-label="Log something"></section>

        <section class="dayclock" aria-labelledby="clock-title">
          <div class="section-head">
            <h2 id="clock-title">The day</h2>
            <div class="seg small" role="radiogroup" aria-label="Day view">
              <label><input type="radio" name="dayview" value="clock" checked /><span>Clock</span></label>
              <label><input type="radio" name="dayview" value="grid" /><span>Grid</span></label>
            </div>
          </div>
          <div id="day-clock" class="viz-box clock-box"></div>
        </section>

        <section class="daylog" aria-labelledby="log-title">
          <div class="section-head">
            <h2 id="log-title">Today's log</h2>
            <div class="head-actions">
              <button id="recap-open" class="chip" type="button" title="Day recap (R)">✨ Recap</button>
              <button id="add-entry" class="chip" type="button">+ Add entry</button>
            </div>
          </div>
          <ol id="entries" class="entries"></ol>
          <p id="entries-empty" class="empty">Nothing logged yet.</p>

          <label class="daynote">
            <span class="daynote-label">📝 Day note</span>
            <textarea id="day-note" rows="2" placeholder="Anything special about today?"></textarea>
          </label>
        </section>
      </main>

      <footer class="foot">
        <p>Your log stays on this device. Not medical advice.</p>
        <p class="foot-meta">
          <a href="https://github.com/parmsam/tinylog" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
            GitHub</a>
          <span aria-hidden="true">·</span>
          <span id="app-version"></span>
        </p>
      </footer>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
    <dialog id="settings" class="sheet" aria-labelledby="settings-title"></dialog>
    <dialog id="trends" class="sheet tall" aria-labelledby="trends-title"></dialog>
    <dialog id="shortcuts" class="sheet" aria-labelledby="shortcuts-title"></dialog>
    <dialog id="ambient" class="ambient" aria-label="Bedside display"></dialog>
    <dialog id="recap" class="sheet tall" aria-labelledby="recap-title"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
